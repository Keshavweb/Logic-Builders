# Render Blueprint — chargeback-defender.
#
#   cbdefender-db   free Postgres
#   cbdefender-api  Node web service (API + mock routes in-process)
#   cbdefender-ui   static site (the React app, standalone build — no RocketRide shell)
#
# Deploy:  push this repo to GitHub -> Render Dashboard -> New -> Blueprint
#          -> pick the repo. Then set GEMINI_API_KEY on cbdefender-api, and
#          set cbdefender-ui's VITE_API_BASE_URL to the API's real URL.

databases:
  - name: cbdefender-db
    databaseName: chargeback
    user: chargeback
    plan: free

services:
  - type: web
    name: cbdefender-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/chargeback-defender-api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cbdefender-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false            # set in the Render dashboard (secret)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NODE_VERSION
        value: "22"
      # PORT is injected by Render automatically — do not set it.
      # MOCK_SERVICES_URL defaults to this same service; leave unset.

  - type: web
    name: cbdefender-ui
    runtime: static
    plan: free
    rootDir: apps/logicBuilders-ui
    buildCommand: npm ci && npx vite build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        # replace with cbdefender-api's real URL after first deploy
        value: https://cbdefender-api.onrender.com
