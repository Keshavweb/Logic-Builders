# Render Blueprint — chargeback-defender backend.
#
# One managed Postgres + one Node web service (the API, with the mock
# backing-service routes mounted in-process, so nothing else to deploy).
#
# Deploy:  push this repo to GitHub -> Render Dashboard -> New -> Blueprint
#          -> pick the repo. Then set GEMINI_API_KEY on the service.

databases:
  - name: cbdefender-db
    databaseName: chargeback
    user: chargeback
    plan: free

services:
  - type: web
    name: cbdefender-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/chargeback-defender-api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cbdefender-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false            # set in the Render dashboard (secret)
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: NODE_VERSION
        value: "22"
      # PORT is injected by Render automatically — do not set it.
      # MOCK_SERVICES_URL defaults to this same service; leave unset.
